---
- name: Configure Zabbix for Cluster and Home Network
  hosts: localhost
  collections:
    - community.zabbix
  vars:
    zabbix_url: "http://zabbix-web.monitoring.svc.cluster.local"
    zabbix_user: "Admin"
    zabbix_password: "zabbix" # Replace with actual secret injected via Jenkins credentials
  tasks:
    - name: Create Network Discovery Rule for 192.168.05.0/24
      zabbix_discovery_rule:
        server_url: "{{ zabbix_url }}"
        login_user: "{{ zabbix_user }}"
        login_password: "{{ zabbix_password }}"
        name: "Home Network Discovery"
        iprange: "192.168.05.0/24"
        delay: "1h"
        dchecks:
          - type: 9 # ICMP ping
        status: "enabled"

    - name: Enable Kubernetes Cluster Monitoring
      zabbix_host:
        server_url: "{{ zabbix_url }}"
        login_user: "{{ zabbix_user }}"
        login_password: "{{ zabbix_password }}"
        host_name: "murmillo-cluster"
        visible_name: "Kind Cluster (murmillo)"
        host_groups:
          - "Templates/Kubernetes"
        link_templates:
          - "Kubernetes cluster state by HTTP"
        status: "enabled"